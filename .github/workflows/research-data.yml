name: Research data (history, commodities, options)

# Weekday evenings after the US close; nothing on weekends.
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Options chains and analytics
        run: python options_engine.py
        continue-on-error: true
      - name: Price history (stocks, ETFs, indexes)
        run: python hist_engine.py
        continue-on-error: true
      - name: BCOM commodities (continuous + contracts)
        run: python commod_engine.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Research data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
