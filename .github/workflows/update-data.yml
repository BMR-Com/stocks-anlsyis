name: Update market data

on:
  schedule:
    - cron: "0 22 * * 1-5"      # 22:00 UTC weekdays — after US market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persisted price + options cache (NOT committed). First run downloads full history.
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: mktcache-${{ github.run_id }}
          restore-keys: |
            mktcache-

      - name: Universe price scan (incremental)
        run: python scan_engine.py
        continue-on-error: true

      - name: Options-volume scan (rotating sweep)
        run: python opt_scan_engine.py
        continue-on-error: true

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: mktcache-${{ github.run_id }}

      - name: Detailed watchlist (chart + options + fundamentals)
        run: python ta_engine.py
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
