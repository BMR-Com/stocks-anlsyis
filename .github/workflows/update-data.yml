name: Update TA data

on:
  schedule:
    - cron: "0 22 * * 1-5"      # 22:00 UTC, weekdays — after US market close
  workflow_dispatch:            # adds a manual "Run workflow" button

permissions:
  contents: write               # allow the action to commit data back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the engine
        run: python ta_engine.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update TA data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
