name: Update market data
 
on:
  schedule:
    - cron: "0 22 * * 1-5"      # 22:00 UTC weekdays — after US market close
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Universe scan (S&P500 + Nasdaq-100 + Russell 2000)
        run: python scan_engine.py
        continue-on-error: true          # a partial scan still commits
 
      - name: Detailed watchlist (chart + options + fundamentals)
        run: python ta_engine.py
        continue-on-error: true
 
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
 
