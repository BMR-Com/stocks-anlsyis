name: Update market data

on:
  schedule:
    - cron: "0 22 * * 1-5"      # 22:00 UTC weekdays — after US market close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300           # first run downloads full history; later runs are quick
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the price history cache from the previous run (persists between runs,
      # NOT committed to the repo). First ever run finds nothing and downloads full history.
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - name: Universe scan (incremental)
        run: python scan_engine.py
        continue-on-error: true

      # Save the updated cache under a fresh key so next run restores it via the prefix.
      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}

      - name: Detailed watchlist (chart + options + fundamentals)
        run: python ta_engine.py
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
